<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="{{ "manifest.webmanifest" | absURL }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="apple-touch-icon" href="{{ "icons/icon-192.png" | absURL }}">
  {{ partial "css.html" . }}
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E💪%3C/text%3E%3C/svg%3E">
</head>
<body class="flex min-h-screen flex-col bg-bg text-body antialiased" data-base="{{ .Site.BaseURL }}">
  {{ partial "header.html" . }}
  <main class="mx-auto w-full max-w-2xl flex-1 px-4 py-5 pb-12">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/main.js" }}
    {{ with . | minify | fingerprint }}
      <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{ end }}
  {{ end }}
</body>
</html>
