<div class="rounded-xl border border-line bg-surface p-4 mb-3" data-exercise-id="{{ .id }}" data-sets="{{ .sets }}" data-reps="{{ .reps }}"{{ with .startingWeight }} data-weight="{{ . }}"{{ end }} data-exercise-name="{{ .name }}"{{ with .demo }} data-demo="{{ . | absURL }}"{{ end }}>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h4 class="text-base font-semibold text-heading break-words">{{ .name }}</h4>
      <div class="mt-1 flex flex-wrap gap-1.5">
        <span class="rounded-full bg-surface-2 px-2 py-0.5 text-xs text-muted">{{ .muscle }}</span>
        <span class="rounded-full bg-surface-2 px-2 py-0.5 text-xs text-muted">{{ .equipment }}</span>
      </div>
    </div>
    <div class="text-right font-bold tabular-nums text-base whitespace-nowrap">{{ .sets }} × {{ .reps }}{{ with .startingWeight }} · {{ . }} kg{{ end }}</div>
  </div>
  {{ with .notes }}<p class="mt-2 text-sm text-muted">{{ . }}</p>{{ end }}
  {{ if or .description .demo }}
    <details class="mt-3">
      <summary class="cursor-pointer text-sm text-accent py-1 min-h-[30px]">How to perform</summary>
      {{ with .demo }}<img class="mt-2 h-[180px] w-[180px] rounded-lg bg-white object-cover" src="{{ . | absURL }}" loading="lazy" alt="{{ $.name }} demonstration">{{ end }}
      {{ with .description }}<div class="mt-2 text-sm text-muted whitespace-pre-line">{{ . }}</div>{{ end }}
    </details>
  {{ end }}
</div>
