category: Indoor Circuit
description: The run substitute when running outside is not possible or not safe
icon: 🔥
exercises:
- id: zc_jumping_jacks
  name: Jumping Jacks
  sets: 4
  reps: 40s
  muscle: Full body
  equipment: None
  notes: Circuit station 1 of 6 · 40s work / 20s rest
  description: 'Execution: Stand tall, jump the feet out while the arms go overhead,
    jump back in.

    Key points: Land soft on the midfoot and keep a steady rhythm for the whole 40
    seconds.

    Tip: This is the warm-up station. Go easy on the first round and let the heart
    rate climb.

    '
  demo: exercises/3224-1g5bPpA.gif
- id: zc_mountain_climbers
  name: Mountain Climbers
  sets: 4
  reps: 40s
  muscle: Core / cardio
  equipment: Mat or towel
  notes: Circuit station 2 of 6 · 40s work / 20s rest
  description: 'Execution: From a high plank, drive one knee toward the chest and
    alternate fast, hips low and stable.

    Key points: The hips must not bounce up and down; the work comes from the legs,
    not the lower back.

    Tip: If the lower back starts to sag, slow down instead of stopping.

    '
  demo: exercises/0630-RJgzwny.gif
- id: zc_bodyweight_squat
  name: Bodyweight Squats
  sets: 4
  reps: 40s
  muscle: Legs
  equipment: None
  notes: Circuit station 3 of 6 · 40s work / 20s rest
  description: 'Execution: Feet shoulder width, sit back and down until the thighs
    are parallel, chest up, then stand.

    Key points: Knees track over the toes, heels stay down, full depth every rep.

    Tip: This is the only leg station. Aim for a constant pace of about 20 reps per
    40 seconds rather than sprinting the first 15 and stopping.

    '
  demo: exercises/3221-ia6kIIl.gif
- id: zc_shadow_boxing
  name: Shadow Boxing
  sets: 4
  reps: 40s
  muscle: Shoulders / cardio
  equipment: None
  notes: Circuit station 4 of 6 · 40s work / 20s rest
  description: 'Execution: Guard up, throw straight punches and hooks into the air,
    rotating the hips and keeping the feet light.

    Key points: Keep the wrists straight and do not lock the elbows; breathe out on
    every punch.

    Tip: It feels easy for the first 20 seconds and then it does not. Keep the guard
    up the whole time.

    '
  demo: exercises/2271-hoXt6wv.gif
- id: zc_burpee
  name: Burpees
  sets: 4
  reps: 40s
  muscle: Full body
  equipment: None
  notes: Circuit station 5 of 6 · 40s work / 20s rest
  description: 'Execution: Squat, hands down, jump the feet back to a plank, push-up
    optional, jump the feet in and stand up.

    Key points: Step the feet back instead of jumping them if the floor is slippery
    or the neighbours are close.

    Tip: This is the hardest station. Pick a pace you can hold for all four rounds,
    not a pace that empties you in round one.

    '
  demo: exercises/1160-dK9394r.gif
- id: zc_plank_hold
  name: Plank Hold
  sets: 4
  reps: 40s
  muscle: Core
  equipment: Mat or towel
  notes: Circuit station 6 of 6 · 40s work / 20s rest
  description: 'Execution: Forearms and toes on the floor, body in one line from the
    head to the heels, glutes and abs tight.

    Key points: Do not let the hips drop or pike up. Squeeze the glutes and breathe
    normally.

    Tip: This closes the round. Then rest 90 seconds and start the next round at station
    1.

    '
  demo: exercises/2135-VBAWRPG.gif
- id: zc_hip_flexor
  name: Hip Flexor Stretch
  sets: 1
  reps: 60s
  muscle: Mobility
  equipment: Mat or towel
  notes: Mobility station 1 of 6 · 60s each, two passes for the full 10 min
  description: 'Execution: Half kneeling, tuck the pelvis and push the hips forward
    until you feel the front of the rear hip.


    Key points: Do not arch the lower back; the tuck is what makes the stretch land
    on the hip and not the spine.


    Tip: The tightest spot after a week of sitting on planes and in cars. Stay 60
    seconds per side.'
  demo: exercises/1564-tFGKm99.gif
- id: zc_hamstring
  name: Hamstring Stretch
  sets: 1
  reps: 60s
  muscle: Mobility
  equipment: Mat or towel
  notes: Mobility station 2 of 6 · 60s each, two passes for the full 10 min
  description: 'Execution: Seated or standing with one leg long, hinge from the hip
    with a flat back until the back of the thigh pulls.


    Key points: Hinge at the hip, not the waist. A flat back and a small range beats
    a rounded back and a big one.


    Tip: This is the one that keeps the running muscles from stiffening while the
    mileage is at zero.'
  demo: exercises/1511-99rWm7w.gif
- id: zc_thoracic_rotation
  name: Thoracic Rotation
  sets: 1
  reps: 60s
  muscle: Mobility
  equipment: Mat or towel
  notes: Mobility station 3 of 6 · 60s each, two passes for the full 10 min
  description: 'Execution: Side lying with the knees bent, open the top arm and rotate
    the chest toward the ceiling, follow the hand with the eyes.


    Key points: The knees stay stacked together; the movement comes from the mid back,
    not the lower back.


    Tip: Do both sides slowly. This is what undoes a day of sitting.'
  demo: exercises/2329-2jl9K55.gif
- id: zc_shoulder_dislocates
  name: Shoulder Dislocates
  sets: 1
  reps: 60s
  muscle: Mobility
  equipment: Mat or towel
  notes: Mobility station 4 of 6 · 60s each, two passes for the full 10 min
  description: 'Execution: Hold a towel wide with both hands and pass it over the
    head and behind the back, then back.


    Key points: Widen the grip until it is painless; narrow it week by week. Never
    force the range.


    Tip: A towel is enough, no band needed. Ten slow passes each way.'
  demo: exercises/1271-Uto7l43.gif
- id: zc_cat_cow
  name: Cat-Cow
  sets: 1
  reps: 60s
  muscle: Mobility
  equipment: Mat or towel
  notes: Mobility station 5 of 6 · 60s each, two passes for the full 10 min
  description: 'Execution: On all fours, alternate rounding the back up and dropping
    the belly while lifting the chest and the head.


    Key points: Move with the breath: exhale to round, inhale to arch. Slow, one vertebra
    at a time.


    Tip: Ten slow cycles. The best two minutes in the whole plan for a stiff lower
    back.'
  demo: exercises/1363-JbC2iaV.gif
- id: zc_deep_squat_hold
  name: Deep Squat Hold
  sets: 1
  reps: 60s
  muscle: Mobility
  equipment: Mat or towel
  notes: Mobility station 6 of 6 · 60s each, two passes for the full 10 min
  description: 'Execution: Sit into the deepest squat you can with the heels down
    and the chest up, and hold.


    Key points: Hold a doorframe or the bed if the heels lift; work toward heels down
    over the weeks.


    Tip: This is the closest thing to the ankle and hip range that running gives you.
    Aim for 60 seconds.'
  demo: exercises/3119-75Bgtjy.gif
