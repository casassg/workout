category: Functional
icon: 🔥
description: 'High-intensity functional movements. 21-15-9 protocol: pick 2 movements,
  do rounds of 21/15/9 reps (~8-10 min). Beginner: 15-12-9. Max 2x/week, 48h recovery.'
exercises:
- id: thruster_dumbbell
  name: Thruster (Dumbbell)
  muscle: Full Body
  equipment: Dumbbells
  sets: 3
  reps: 21-15-9
  startingWeight: 8
  demo: exercises/0550-yWxMvB5.gif
  description: Start by standing with your feet shoulder-width apart, holding a kettlebell
    in front of your chest with both hands, palms facing each other. Lower into a
    squat position by bending your knees and pushing your hips back, keeping your
    chest up and your back straight. As you reach the bottom of the squat, explosively
    drive through your heels to stand up, simultaneously pressing the kettlebell overhead.
    Lock out your arms at the top of the movement, fully extending your elbows. Lower
    the kettlebell back to the starting position by reversing the movement, bending
    your elbows and lowering the weight back to your chest. Repeat for the desired
    number of repetitions.
- id: kettlebell_swing
  name: Kettlebell Swing
  muscle: Posterior Chain
  equipment: Kettlebell
  sets: 3
  reps: 21-15-9
  startingWeight: 12
  demo: exercises/0549-UHJlbu3.gif
  description: Stand with your feet shoulder-width apart, toes pointed slightly outward.
    Hold the kettlebell with both hands in front of your body, arms extended. Bend
    your knees slightly and hinge at the hips, pushing your butt back. Swing the kettlebell
    back between your legs, keeping your arms straight and maintaining a flat back.
    Drive your hips forward and swing the kettlebell up to shoulder height, using
    the momentum generated by your hips. Allow the kettlebell to swing back down between
    your legs and repeat the movement for the desired number of repetitions.
- id: burpee
  name: Burpee
  muscle: Full Body
  equipment: Bodyweight
  sets: 3
  reps: 21-15-9
  startingWeight: 0
  demo: exercises/1160-dK9394r.gif
  description: Start in a standing position with your feet shoulder-width apart. Lower
    your body into a squat position by bending your knees and placing your hands on
    the floor in front of you. Kick your feet back into a push-up position. Perform
    a push-up, keeping your body in a straight line. Jump your feet back into the
    squat position. Jump up explosively, reaching your arms overhead. Land softly
    and immediately lower back into a squat position to begin the next repetition.
- id: goblet_squat_func
  name: Goblet Squat
  muscle: Quads, Glutes
  equipment: Dumbbell
  sets: 3
  reps: 21-15-9
  startingWeight: 12
  demo: exercises/1760-yn8yg1r.gif
  description: Stand with your feet shoulder-width apart, holding a dumbbell vertically
    against your chest with both hands. Keeping your chest up and core engaged, lower
    your body down into a squat position by pushing your hips back and bending your
    knees. Continue lowering until your thighs are parallel to the ground, or as low
    as you can comfortably go. Pause for a moment at the bottom, then push through
    your heels to return to the starting position. Repeat for the desired number of
    repetitions.
- id: push_up
  name: Push-up
  muscle: Chest, Triceps
  equipment: Bodyweight
  sets: 3
  reps: 21-15-9
  startingWeight: 0
  demo: exercises/0662-I4hDWkc.gif
  description: Start in a high plank position with your hands slightly wider than
    shoulder-width apart and your feet together. Engage your core and lower your body
    towards the ground by bending your elbows, keeping your body in a straight line.
    Pause for a moment when your chest is just above the ground, then push yourself
    back up to the starting position by straightening your arms. Repeat for the desired
    number of repetitions.
- id: mountain_climber_func
  name: Mountain Climber
  muscle: Core, Cardio
  equipment: Bodyweight
  sets: 3
  reps: 21-15-9
  startingWeight: 0
  demo: exercises/0630-RJgzwny.gif
  description: Start in a high plank position with your hands directly under your
    shoulders and your body in a straight line. Engage your core and bring your right
    knee towards your chest, then quickly switch and bring your left knee towards
    your chest. Continue alternating legs in a running motion, keeping your hips low
    and your core engaged. Maintain a steady pace and breathe evenly throughout the
    exercise. Repeat for the desired number of repetitions.
- id: jump_squat
  name: Jump Squat
  muscle: Quads, Glutes
  equipment: Bodyweight
  sets: 3
  reps: 21-15-9
  startingWeight: 0
  demo: exercises/0514-LIlE5Tn.gif
  description: Stand with your feet shoulder-width apart. Lower your body into a squat
    position by bending your knees and pushing your hips back. Jump explosively off
    the ground, extending your hips, knees, and ankles. While in mid-air, quickly
    bring your arms forward for balance. Land softly on the balls of your feet and
    immediately go into the next repetition. Repeat for the desired number of repetitions.
- id: renegade_row
  name: Renegade Row
  muscle: Back, Core
  equipment: Dumbbells
  sets: 3
  reps: 21-15-9
  startingWeight: 6
  demo: exercises/0521-b9kqlBy.gif
  description: Start in a high plank position with your hands gripping the kettlebells
    and your feet hip-width apart. Engage your core and keep your body in a straight
    line from head to heels. Pull one kettlebell up towards your chest, keeping your
    elbow close to your body. Lower the kettlebell back down to the starting position
    and repeat with the other arm. Continue alternating arms for the desired number
    of repetitions.
