category: Posture
icon: 🧍
description: 'Anterior pelvic tilt fix: glute activation + anti-extension core + hip
  flexor opening. ~8 min. Do after gym sessions or on rest days, daily if possible.'
exercises:
- id: glute_bridge
  name: Glute Bridge
  muscle: Glutes
  equipment: Bodyweight
  sets: 3
  reps: 15
  notes: The main fix for anterior pelvic tilt - weak glutes let the pelvis tip forward
  description: 'Setup: Lie on your back, knees bent, feet flat on the floor hip-width
    apart, arms at your sides.

    Execution: Squeeze your glutes and lift your hips until knees, hips and shoulders
    form a straight line. At the top, tuck your tailbone slightly (posterior pelvic
    tilt) - do NOT overarch your lower back. Hold 1 second, lower slowly.

    Key points: Drive through your heels. If your hamstrings cramp, your glutes are
    not firing - lighten up and focus on squeezing the glutes first.'
  demo: exercises/3013-u0cNiij.gif
- id: dead_bug
  name: Dead Bug
  muscle: Core
  equipment: Bodyweight
  sets: 3
  reps: 8 per side
  notes: Anti-extension core work - teaches the pelvis to stay neutral under load
  description: 'Setup: Lie on your back, arms extended toward the ceiling, hips and
    knees bent at 90 degrees. Press your lower back flat into the floor - there should
    be no gap.

    Execution: Slowly lower your right arm overhead and extend your left leg out,
    keeping the lower back glued to the floor. Return and repeat on the other side.

    Key points: Move slowly. If your back arches off the floor, you have gone too
    far - shorten the range. Breathe out on each extension.'
  demo: exercises/0276-iny3m5y.gif
- id: bird_dog
  name: Bird Dog
  muscle: Glutes, Core
  equipment: Bodyweight
  sets: 3
  reps: 8 per side
  notes: Posterior chain stability - glutes and spinal stabilizers working together
  description: 'Setup: On all fours, hands under shoulders, knees under hips, back
    flat and neutral.

    Execution: Extend your right arm forward and left leg back until both are in line
    with your torso. Squeeze the glute of the extended leg. Hold 2 seconds, return
    slowly, repeat on the other side.

    Key points: Do not let your hips rotate or your lower back arch. Imagine balancing
    a glass of water on your lower back.'
- id: half_kneeling_hip_flexor_stretch
  name: Half-Kneeling Hip Flexor Stretch
  muscle: Hip Flexors
  equipment: Bodyweight
  sets: 2
  reps: 45s per side
  notes: Opens the tight hip flexors that pull the pelvis forward (desk-worker classic)
  description: 'Setup: Half-kneeling position, one knee on the floor (pad it), other
    foot flat in front, torso tall.

    Execution: Tuck your tailbone slightly (posterior pelvic tilt) and shift your
    weight gently forward until you feel a stretch in the front of the back hip. Raise
    the arm on the kneeling side overhead and lean slightly away for a deeper stretch.

    Key points: The tuck is the whole exercise - without it you are just arching your
    back and missing the hip flexors entirely.'
- id: couch_stretch
  name: Couch Stretch
  muscle: Hip Flexors, Quads
  equipment: Wall or couch
  sets: 2
  reps: 60s per side
  notes: Deeper version - hits rectus femoris plus hip flexors
  description: 'Setup: Facing away from a wall or couch, half-kneel with the back
    shin vertical against the wall (top of foot on the wall), front foot flat.

    Execution: Tuck your tailbone, keep your torso tall, and ease your hips toward
    the wall until you feel a strong stretch down the front of the back thigh.

    Key points: Start gently - this one is intense. Keep the glute of the back leg
    squeezed to protect the lower back. Breathe and relax into it.'
