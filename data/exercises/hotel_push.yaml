category: Hotel Push
description: 'Dumbbells and a bench only: no barbell in a hotel gym'
icon: 🏋️
exercises:
- id: tp_db_bench
  name: Dumbbell Bench Press
  sets: 4
  reps: 10
  muscle: Chest
  equipment: Dumbbells + bench
  description: 'Setup: Lie flat, feet planted, dumbbells at chest level, elbows at about 45 degrees from the torso.

    Execution: Press up and slightly together without clanging the dumbbells, then lower for three seconds.

    Tip: No bench? Do a Dumbbell Floor Press on a mat: the floor caps the range but protects the shoulders.

    '
  notes: Reference load per dumbbell, taken from your home incline dumbbell press. Your barbell bench (47.22 kg) is total bar + plates, so it is not comparable per hand. The main press of the day. Get two
    sets at your top weight before adding anything.
  demo: exercises/0289-SpYC0Kp.gif
  startingWeight: 27.29
- id: tp_incline_db
  name: Incline Dumbbell Press
  sets: 3
  reps: 10
  muscle: Upper chest
  equipment: Dumbbells + incline bench
  description: 'Setup: Bench at 30 degrees, not higher, or the front delts take over from the chest.

    Execution: Press straight up over the collar bone, lower to a three-second count.

    Tip: No incline bench? Raise one end of a flat bench on a plyo box, or overhead-press instead.

    '
  demo: exercises/0314-ns0SIbU.gif
  startingWeight: 27.29
  notes: Reference load same as the home incline dumbbell press.
- id: tp_db_ohp
  name: Seated Dumbbell Overhead Press
  sets: 4
  reps: 10
  muscle: Shoulders
  equipment: Dumbbells + bench
  description: 'Setup: Back supported, dumbbells at shoulder height, wrists stacked over elbows.

    Execution: Press to lockout without arching the lower back, lower under control.

    Key points: Ribs down, glutes tight. If the back arches, reduce the weight, not the reps.

    '
  demo: exercises/0405-znQUdHY.gif
  startingWeight: 24.54
  notes: Reference load from your home overhead press.
- id: tp_lateral_raise
  name: Dumbbell Lateral Raise
  sets: 3
  reps: 12
  muscle: Side delts
  equipment: Dumbbells
  description: 'Setup: Slight forward lean, tiny bend in the elbows, dumbbells at the sides.

    Execution: Raise to shoulder height, lead with the elbows, lower for three seconds.

    Tip: Light dumbbells are perfect here. Go slow rather than heavy.

    '
  demo: exercises/0334-DsgkuIt.gif
  startingWeight: 18.38
  notes: Reference load from your home dumbbell lateral raise. Hotel racks often stop well below this.
- id: tp_oh_triceps
  name: Overhead Dumbbell Triceps Extension
  sets: 3
  reps: 12
  muscle: Triceps
  equipment: One dumbbell
  description: 'Setup: Both hands cupping one dumbbell, arms overhead, elbows pointing forward.

    Execution: Lower behind the head until the forearms touch the biceps, press back to lockout.

    '
  demo: exercises/2188-kont8Ut.gif
  startingWeight: 13.63
  notes: Reference load from your home overhead triceps extension.
- id: tp_rope_pushdown
  name: Rope Triceps Pushdown
  sets: 3
  reps: 12
  muscle: Triceps
  equipment: Cable machine + rope
  description: 'Setup: rope on a high pulley, elbows pinned to the ribs, slight forward lean.

    Execution: Push down and spread the rope ends apart at the bottom, then let it rise slowly for three seconds.

    Key points: Only the forearms move. If the elbows travel forward, drop the weight.'
  notes: Reference load from your home tricep pushdown. The hotel has a cable station with a rope, so the pushdown is back on the menu (confirmed at the gym 19/10). It replaces the bench dips as the isolation
    finisher if you are short of time, or do both.
  demo: exercises/0200-dU605di.gif
  startingWeight: 17.94
- id: tp_kickback_dips
  name: Bench Dips
  sets: 3
  reps: 12
  muscle: Triceps
  equipment: Bench or chair
  description: 'Setup: Hands on the bench behind you, fingers forward, legs extended.

    Execution: Lower until the elbows reach 90 degrees, press back up.

    Tip: Elbows stay pointing straight back, not out to the sides.

    '
  demo: exercises/0129-RrLske5.gif
  notes: Bodyweight, no load to set.
- id: tp_pushups
  name: Push-Ups
  sets: 2
  reps: AMRAP (15-25)
  muscle: Chest
  equipment: None
  description: 'Execution: One set to near failure as a finisher, body in one line, elbows at 45 degrees.

    Tip: Too easy? Elevate the feet on the bench.

    '
  demo: exercises/0662-I4hDWkc.gif
  notes: 'AMRAP means as many clean reps as possible, not to total failure: stop 1 or 2 reps short, because this is a maintenance block and the next push day should feel the same. Two sets, 90 seconds rest.
    Bodyweight load for you is roughly 57 kg on the hands at 88.7 kg, so it is heavier than your 47 kg bench: 15-25 in the first set and 8-15 in the second is the normal range. More than 25? Elevate the
    feet on the bench. Fewer than 10? Hands on the bench or on the knees, and build from there.'
