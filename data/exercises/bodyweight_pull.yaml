category: Bodyweight Pull
description: 'No equipment at all: a table, a door and a towel'
icon: 🪢
exercises:
- id: z_table_row
  name: Table or Towel Rows
  sets: 4
  reps: 12
  muscle: Back
  equipment: Table or a towel in a door
  description: 'Setup: Lie under a sturdy table, or anchor a towel in a closed door and hold both ends.

    Execution: Pull the chest toward the edge, squeeze the shoulder blades, lower slowly. The lower the body, the harder it is.

    Key points: This is the only real back work available without equipment, so do not skip it.

    '
- id: z_backpack_curl
  name: Backpack Curl
  sets: 3
  reps: 12
  muscle: Biceps
  equipment: Backpack with books or bottles
  description: 'Setup: Hold the loaded backpack by the straps, elbows at the sides.

    Execution: Curl up, three seconds down. Add or remove weight by adding or removing bottles.

    '
- id: z_superman
  name: Superman
  sets: 3
  reps: 15
  muscle: Lower back
  equipment: None
  description: 'Execution: Face down, lift the arms and legs off the floor together, hold one second at the top, lower slowly.

    '
- id: z_towel_row_hold
  name: Towel Isometric Row Hold
  sets: 3
  reps: 30s
  muscle: Back + grip
  equipment: Towel
  description: 'Execution: Anchor the towel and pull hard with straight arms, holding tension for 30 seconds.

    Tip: Boring, but it is the closest thing to a lat pulldown with nothing in the room.

    '
