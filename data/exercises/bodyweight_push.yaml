category: Bodyweight Push
description: 'No equipment at all: floor space and maybe a chair'
icon: 🏋️
exercises:
- id: z_pushup
  name: Push-Ups
  sets: 4
  reps: 15
  muscle: Chest
  equipment: None
  description: 'Execution: Elbows at 45 degrees, body in one line from head to heels.

    Tip: Elevate the hands on a chair to make it easier, or the feet to make it harder.

    '
- id: z_pike
  name: Pike Push-Ups
  sets: 3
  reps: 10
  muscle: Shoulders
  equipment: None
  description: 'Setup: Hips high, hands and feet on the floor, head between the hands.

    Execution: Lower the crown of the head toward the floor, press back up. This is the overhead press of the trip.

    '
- id: z_dips
  name: Chair Dips
  sets: 3
  reps: 12
  muscle: Triceps
  equipment: Chair
  description: 'Setup: Hands on the edge of a sturdy chair behind you, legs extended.

    Execution: Lower until the elbows reach 90 degrees, press back up. Keep the elbows pointing back.

    '
- id: z_plank
  name: Plank
  sets: 3
  reps: 45s
  muscle: Core
  equipment: None
  description: 'Execution: Elbows under the shoulders, glutes locked, no sagging hips.

    '
