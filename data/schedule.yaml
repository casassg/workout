# Weekly schedule template
# Push/Pull/Legs + Running rotation
# Última revisió: 2026-08-21 (recuperat del refredat: dissabte run llarg, diumenge functional opcional)

week:
  monday:
    type: "gym"
    workout: "push"
    duration: 60
    description: "Start the week with upper body push exercises + abs"
    icon: "🏋️"
    includeAbs: true
    extra:
      type: "run"
      workout: "easy_run"
      duration: 40
      description: "Easy run with Laura AFTER dinner (18:00-19:00)"
      icon: "🏃"

  tuesday:
    type: "rest"
    duration: 0
    description: "Rest day - recovering from a cold (easy run paused until recovered)"
    icon: "🧘"

  wednesday:
    type: "gym"
    workout: "pull"
    duration: 60
    description: "Back and biceps day + abs. Football at 19:00"
    icon: "🏋️"
    includeAbs: true

  thursday:
    type: "rest"
    duration: 0
    description: "Rest day - recovering from a cold (tempo run paused until recovered)"
    icon: "🧘"

  friday:
    type: "gym"
    workout: "push"
    alternateWeekly: "legs"
    duration: 60
    description: "Push or Legs (alternates weekly). No afternoon run"
    icon: "🏋️"
    includeAbs: true

  saturday:
    type: "run"
    workout: "long_run"
    duration: 60
    description: "Long run 60' moderate (Mode A). First long run back after the cold: easy pace, build gently."
    icon: "🏃"

  sunday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery (walking, stretching) encouraged"
    icon: "🧘"

# Alternation tracking
alternation:
  friday:
    exercises:
      - "push"
      - "legs"
    description: "Alternates between Push and Legs each week"