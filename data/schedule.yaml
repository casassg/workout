# Weekly schedule template
# Push/Pull/Legs + Running rotation
# Última revisió: 2026-10-30 (HONDURAS ZERO-EQUIPMENT MODE)
#
# !! CURRENT MODE: Honduras, zero equipment, no outdoor running (not safe). !!
# Mon bodyweight push / Wed bodyweight pull / Fri bodyweight legs, 30' each, plus an
# indoor circuit on Saturday instead of the long run. No run events at all this week.
# REVERT to the home gym plan (push 60 + easy run, pull 60, push 60, long run 60) as soon
# as the Houston gym is available again; travel window 30/10-15/11 (see travel_windows.json).

week:
  monday:
    type: "gym"
    workout: "bodyweight_push"
    duration: 30
    description: "Zero-equipment push: push-ups, pike push-ups, chair dips, planks. No run (outdoor running is not safe here)"
    icon: "🏋️"

  tuesday:
    type: "rest"
    duration: 0
    description: "Rest day - easy walk / active recovery"
    icon: "🧘"

  wednesday:
    type: "gym"
    workout: "bodyweight_pull"
    duration: 30
    description: "Zero-equipment pull: table or towel rows, backpack curls, superman holds"
    icon: "🪢"

  thursday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery (walking, stretching)"
    icon: "🧘"

  friday:
    type: "gym"
    workout: "bodyweight_legs"
    duration: 30
    description: "Zero-equipment legs: split squats, single-leg glute bridge, wall sit, towel hamstring curl"
    icon: "🦵"

  saturday:
    type: "gym"
    workout: "indoor_circuit"
    duration: 30
    description: "Indoor circuit replaces the long run: outdoor running is not safe here. 6 stations, 40s work / 20s rest, 4 rounds, bodyweight only"
    icon: "🔥"

  sunday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery (walking, stretching) encouraged"
    icon: "🧘"
