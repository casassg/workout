# Weekly schedule template
# Push/Pull/Legs + Running rotation
# Última revisió: 2026-10-18 (TRAVEL MODE: monday and wednesday point at the hotel
# dumbbell sessions hotel_push / hotel_pull instead of the home push / pull gym days.
# Revert those two back to "push" and "pull" when the home gym is available again.)

week:
  monday:
    type: "gym"
    workout: "hotel_push"
    duration: 50
    description: "Push on dumbbells only (no barbell, no cable stack). Easy run after dinner"
    icon: "🏋️"
    includeAbs: true
    extra:
      type: "run"
      workout: "easy_run"
      duration: 40
      description: "Easy run 40' on the treadmill or outside"
      icon: "🏃"

  tuesday:
    type: "rest"
    duration: 0
    description: "Rest day - easy walk / active recovery"
    icon: "🧘"

  wednesday:
    type: "gym"
    workout: "hotel_pull"
    duration: 50
    description: "Pull on dumbbells only: rows in place of the lat pulldown"
    icon: "🏋️"
    includeAbs: true

  thursday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery before tempo run Friday-week"
    icon: "🧘"

  friday:
    type: "gym"
    workout: "push"
    duration: 60
    description: "Push (upper body focus, 2nd session of the week). No afternoon run"
    icon: "🏋️"
    includeAbs: true

  saturday:
    type: "run"
    workout: "long_run"
    duration: 60
    description: "Long run 60' moderate (Mode A). First long run back after the cold: easy pace, build gently."
    icon: "🏃"

  sunday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery (walking, stretching) encouraged"
    icon: "🧘"
