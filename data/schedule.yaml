# Weekly schedule template
# Push/Pull/Legs + Running rotation
# Última revisió: 2026-10-23 (HONDURAS ZERO-EQUIPMENT MODE, 23/10 to 7/11)
# No equipment there and outdoor running is not safe, so the whole week is bodyweight:
# monday bodyweight_push, wednesday bodyweight_pull, friday bodyweight_legs, and the
# saturday long run is replaced by the indoor_circuit.
# REVERT all four to "push" / "pull" / "legs" / "long_run" (run, 60 min) when the home
# gym is available again, on 8/11.

week:
  monday:
    type: "gym"
    workout: "bodyweight_push"
    duration: 30
    description: "Push with no equipment: push-ups, pike push-ups, chair dips. No run: running outside is not safe here"
    icon: "🏋️"
    includeAbs: true

  tuesday:
    type: "rest"
    duration: 0
    description: "Rest day - easy walk / active recovery"
    icon: "🧘"

  wednesday:
    type: "gym"
    workout: "bodyweight_pull"
    duration: 30
    description: "Pull with no equipment: table or towel rows, backpack curls, superman"
    icon: "🏋️"
    includeAbs: true

  thursday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery before the Friday session"
    icon: "🧘"

  friday:
    type: "gym"
    workout: "bodyweight_legs"
    duration: 30
    description: "Legs with no equipment: split squats, single-leg glute bridge, wall sit, towel hamstring curl"
    icon: "🏋️"
    includeAbs: true

  saturday:
    type: "gym"
    workout: "indoor_circuit"
    duration: 30
    description: "Indoor circuit replaces the long run: outdoor running is not safe here. 40s on / 20s off, 4 rounds, plus mobility"
    icon: "🔥"

  sunday:
    type: "rest"
    duration: 0
    description: "Rest day - active recovery (walking, stretching) encouraged"
    icon: "🧘"
