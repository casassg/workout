intro: The same split as the home plan (push, pull, legs) rebuilt around whatever equipment the place has. If a machine is missing, the dumbbell version always works; if the dumbbells are missing, the bodyweight
  version does.
rules:
- 'Keep the same days: push Monday, pull Wednesday, legs Friday.'
- No barbell anywhere on the road, so every press becomes a dumbbell press. There IS a cable rope station.
- 'Drop the load, not the session: travel dumbbells are usually light, so add reps and slow the lowering phase to 3 seconds.'
- Cardio on a treadmill, elliptical or bike. A hotel run at zone 2, 35 minutes, is the same stimulus as the home one.
- Nothing new and nothing maximal on the road. The goal is to keep the habit and the muscle, not to set PRs.
- 'Cables are back: rope pushdowns on push day, face pulls on pull day.'
modes:
- id: hotel_gym
  name: Hotel gym
  icon: 🏨
  equipment: Dumbbells and kettlebells (usually light to medium), a cable station with a rope attachment, one weight machine, medicine and balance balls, a bench or plyo box, treadmills, ellipticals, a
    bike.
  note: No barbell. The cable rope station is confirmed (19/10), so pushdowns and face pulls are in.
  blocks:
  - id: travel_push
    name: Push — dumbbell day
    icon: 🏋️
    duration: 50-55 min
    category: hotel_push
  - id: travel_pull
    name: Pull — dumbbell day
    icon: 🪢
    duration: 50-55 min
    category: hotel_pull
  - id: travel_legs
    name: Legs — dumbbell day
    icon: 🦵
    duration: 40-45 min
    category: hotel_legs
  - id: travel_cardio
    name: Cardio — treadmill or bike
    icon: 🏃
    duration: 35 min
    category: hotel_cardio
- id: zero_equipment
  name: Zero equipment
  icon: 🧳
  equipment: Nothing but floor space, about two square metres, a chair and a backpack.
  note: For places with no gym and nowhere safe to run. Full body, three days a week, plus an indoor circuit.
  blocks:
  - id: z_push
    name: Push — bodyweight
    icon: 🏋️
    duration: 25-30 min
    category: bodyweight_push
  - id: z_pull
    name: Pull — bodyweight
    icon: 🪢
    duration: 25-30 min
    category: bodyweight_pull
  - id: z_legs
    name: Legs — bodyweight
    icon: 🦵
    duration: 25-30 min
    category: bodyweight_legs
  - id: z_circuit
    name: Indoor circuit (the run substitute)
    icon: 🔥
    duration: 25-30 min
    category: indoor_circuit
